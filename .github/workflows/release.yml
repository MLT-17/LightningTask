name: Build, Sign, Notarize & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- Signing & Notarization Setup -------------------------------

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$RUNNER_TEMP/certificate.p12" \
            -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"

          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | sed s/\"//g)
          security default-keychain -s "$KEYCHAIN_PATH"

          rm "$RUNNER_TEMP/certificate.p12"

      - name: Set up notarization credentials
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"

          xcrun notarytool store-credentials "notary-profile" \
            --key "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID"

      # --- Build -----------------------------------------------------------

      - name: Build (Release)
        run: |
          xcodebuild \
            -project LightningTask.xcodeproj \
            -scheme LightningTask \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            clean build

      - name: Read version & guard against un-bumped release
        id: version
        run: |
          INFO_PLIST="build/Build/Products/Release/LightningTask.app/Contents/Info.plist"
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$INFO_PLIST")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$INFO_PLIST")
          TAG="v${VERSION}"

          echo "Building version $VERSION (build $BUILD), tag $TAG"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Bump MARKETING_VERSION/CURRENT_PROJECT_VERSION before running this workflow again."
            exit 1
          fi

      - name: Verify entitlements
        run: |
          APP="build/Build/Products/Release/LightningTask.app"
          if codesign -d --entitlements :- "$APP" 2>&1 | grep -q "get-task-allow"; then
            echo "::error::get-task-allow found in entitlements — CODE_SIGN_INJECT_BASE_ENTITLEMENTS not applied correctly."
            exit 1
          fi

      # --- Signing -----------------------------------------------------

      - name: Re-sign nested Sparkle binaries
        run: |
          APP="build/Build/Products/Release/LightningTask.app"
          IDENTITY="Developer ID Application"

          codesign --force --options runtime --timestamp --sign "$IDENTITY" \
            "$APP/Contents/Frameworks/Sparkle.framework/Versions/B/XPCServices/Downloader.xpc"
          codesign --force --options runtime --timestamp --sign "$IDENTITY" \
            "$APP/Contents/Frameworks/Sparkle.framework/Versions/B/XPCServices/Installer.xpc"
          codesign --force --options runtime --timestamp --sign "$IDENTITY" \
            "$APP/Contents/Frameworks/Sparkle.framework/Versions/B/Autoupdate"
          codesign --force --options runtime --timestamp --sign "$IDENTITY" \
            "$APP/Contents/Frameworks/Sparkle.framework/Versions/B/Updater.app/Contents/MacOS/Updater"
          codesign --force --options runtime --timestamp --sign "$IDENTITY" \
            "$APP/Contents/Frameworks/Sparkle.framework/Versions/B/Updater.app"
          codesign --force --options runtime --timestamp --sign "$IDENTITY" \
            "$APP/Contents/Frameworks/Sparkle.framework"
          codesign --force --options runtime --timestamp --sign "$IDENTITY" "$APP"

          codesign --verify --deep --strict --verbose=2 "$APP"

      # --- Zip: Sparkle auto-update artifact ----------------------------

      - name: Create & notarize Zip
        run: |
          cd build/Build/Products/Release
          ditto -c -k --keepParent LightningTask.app LightningTask.zip
          xcrun notarytool submit LightningTask.zip --keychain-profile "notary-profile" --wait

      # --- DMG: first-install artifact ----------------------------------

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create, sign, notarize & staple DMG
        run: |
          cd build/Build/Products/Release
          mkdir -p dmg-staging
          cp -R LightningTask.app dmg-staging/

          create-dmg \
            --volname "LightningTask" \
            --window-size 500 300 \
            --icon "LightningTask.app" 125 150 \
            --app-drop-link 375 150 \
            "LightningTask.dmg" \
            "dmg-staging/"

          codesign --force --sign "Developer ID Application" --timestamp LightningTask.dmg
          codesign --verify --verbose=2 LightningTask.dmg

          xcrun notarytool submit LightningTask.dmg --keychain-profile "notary-profile" --wait

          xcrun stapler staple LightningTask.dmg
          xcrun stapler validate LightningTask.dmg
          spctl -a -vv -t install LightningTask.dmg

      # --- Publish -------------------------------------------------------

      - name: Create GitHub Release
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            build/Build/Products/Release/LightningTask.zip \
            build/Build/Products/Release/LightningTask.dmg \
            --title "${{ steps.version.outputs.tag }}" \
            --notes "Automated release, build ${{ steps.version.outputs.build }}." \
            --target "${{ github.sha }}"

      - name: Generate appcast entry
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          SPARKLE_BIN=$(find build/SourcePackages/artifacts -path "*Sparkle/bin" -type d | head -1)
          chmod +x "$SPARKLE_BIN"/* 2>/dev/null || true

          mkdir -p "$RUNNER_TEMP/appcast-staging"
          cp build/Build/Products/Release/LightningTask.zip "$RUNNER_TEMP/appcast-staging/"

          echo "$SPARKLE_PRIVATE_KEY" | "$SPARKLE_BIN/generate_appcast" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/" \
            "$RUNNER_TEMP/appcast-staging"

      - name: Merge appcast entry into existing history
        run: |
          python3 .github/scripts/merge_appcast.py \
            "$RUNNER_TEMP/appcast-staging/appcast.xml" \
            appcast.xml

      - name: Commit & push appcast.xml
        run: |
          # actions/checkout steht bei Tag-Trigger im "detached HEAD"-
          # Zustand (auf dem Tag-Commit, nicht auf einem Branch) — ein
          # direkter "git push" würde hier fehlschlagen. Deshalb den
          # frisch gemergten Appcast-Inhalt sichern, explizit auf den
          # echten main-Branch wechseln, und dort committen/pushen.
          cp appcast.xml "$RUNNER_TEMP/appcast.xml.merged"

          git fetch origin main
          git checkout -B main origin/main

          cp "$RUNNER_TEMP/appcast.xml.merged" appcast.xml

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          git commit -m "Add ${{ steps.version.outputs.tag }} to appcast" || echo "No changes to commit"
          git push origin main

      # --- Cleanup -------------------------------------------------------

      - name: Clean up keychain & credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
          rm -rf "$RUNNER_TEMP/private_keys" || true

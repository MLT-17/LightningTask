name: Build & Update

on:
  push:
    branches: [main]

jobs:
  build-and-release:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build (Release, automatische Build-Nummer)
        run: |
          xcodebuild \
            -project LightningTask.xcodeproj \
            -scheme LightningTask \
            -configuration Release \
            -derivedDataPath build \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            clean build

      - name: Alte Releases aufräumen & neue Zip erstellen
        env:
          RELEASE_DIR: /Users/matthiastyca/Documents/Projects/Releases/LightningTask
        run: |
          mkdir -p "$RELEASE_DIR"
          rm -f "$RELEASE_DIR"/*.zip
          ditto -c -k --keepParent \
            build/Build/Products/Release/LightningTask.app \
            "$RELEASE_DIR/LightningTask-build${{ github.run_number }}.zip"

      - name: Appcast generieren & signieren
        env:
          SPARKLE_BIN: /Users/matthiastyca/Documents/Projects/Releases/Sparkle-2.9.3/bin
          RELEASE_DIR: /Users/matthiastyca/Documents/Projects/Releases/LightningTask
        run: |
          "$SPARKLE_BIN/generate_appcast" \
            --download-url-prefix "http://localhost:8000/" \
            "$RELEASE_DIR"
